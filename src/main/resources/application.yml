server:
  port: 8089
  servlet:
    context-path: /kubertest

spring:

  application:
    name: kubertest

  datasource:
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: sa
    url: jdbc:postgresql://postgres-service.kubertest-db.svc.cluster.local:5432/test

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true